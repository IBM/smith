        # Car Price MCP — Role-Based Access Policy


        ## Context


        A multi-tenant vehicle pricing platform serves different user roles
        through the FIPE car price agent. Each role has specific permissions
        that control which tools they can call and with what parameters. The
        policy applies based on the user's role and the tool call being made.


        ## Roles


        The system supports five roles: `fleet_manager`, `consumer`,
        `journalist`, `analyst`, and `guest`.


        ## Tool Access by Role


        Not all users can call every tool.


        - A `fleet_manager` may call `get_car_brands`, `search_car_price`, and
        `get_vehicles_by_type`.

        - A `consumer` may call `get_car_brands`, `search_car_price`, and
        `get_vehicles_by_type`.

        - A `journalist` may call `get_car_brands`, `search_car_price`, and
        `get_vehicles_by_type`.

        - An `analyst` may call `get_car_brands`, `search_car_price`, and
        `get_vehicles_by_type`.

        - A `guest` may only call `get_car_brands`. Calls to `search_car_price`
        or `get_vehicles_by_type` must be denied for guests.


        ## Vehicle Type Restrictions


        When calling `get_vehicles_by_type`, the allowed `vehicle_type` values
        depend on the user's role.


        - A `fleet_manager` may only use `vehicle_type` values `"caminhoes"` or
        `"trucks"`. Requests for `"carros"`, `"cars"`, `"motos"`, or
        `"motorcycles"` must be denied.

        - A `consumer` may only use `vehicle_type` values `"carros"` or
        `"cars"`. Requests for `"motos"`, `"motorcycles"`, `"caminhoes"`, or
        `"trucks"` must be denied.

        - A `journalist` may only use `vehicle_type` values `"carros"` or
        `"cars"`. Requests for `"motos"`, `"motorcycles"`, `"caminhoes"`, or
        `"trucks"` must be denied.

        - An `analyst` may use any of the recognized `vehicle_type` values:
        `"carros"`, `"cars"`, `"motos"`, `"motorcycles"`, `"caminhoes"`,
        `"trucks"`.

        - A `guest` cannot call this tool at all.


        `vehicle_type` is matched exactly and case-sensitively against these
        lowercase values. Any other value — including different casing such as
        `"Caminhoes"` — is denied for every role. (Note: the backend silently
        coerces unrecognized types to `"carros"`; the policy must reject them
        rather than rely on that fallback.)


        ## Brand Restrictions


        When calling `search_car_price`, the allowed `brand_name` values depend
        on the user's role.


        - A `fleet_manager` may only search for truck-relevant brands:
        `"Scania"`, `"Volvo"`, `"Mercedes-Benz"`, `"MAN"`, `"DAF"`, `"Iveco"`,
        `"Ford"`, `"Volkswagen"`. Any other brand must be denied.

        - A `consumer` may search for any brand without restriction.

        - A `journalist` may only search for domestic-market brands: `"Fiat"`,
        `"Chevrolet"`, `"Volkswagen"`, `"Hyundai"`, `"Toyota"`, `"Renault"`,
        `"Honda"`, `"Nissan"`, `"Jeep"`, `"Peugeot"`, `"Citroën"`, `"Caoa
        Chery"`. Luxury or imported-only brands such as `"BMW"`,
        `"Mercedes-Benz"`, `"Audi"`, `"Porsche"`, `"Jaguar"`, `"Land Rover"`,
        `"Lexus"`, `"Maserati"`, `"Ferrari"`, `"Lamborghini"`, `"Bentley"`,
        `"Rolls-Royce"`, `"Mini"`, or `"Alfa Romeo"` must be denied.

        - An `analyst` may search for any brand without restriction.

        - A `guest` cannot call this tool at all.


        `brand_name` is compared to the allow/block lists by exact,
        case-sensitive string equality. The agent must normalize user input to
        the canonical FIPE brand spelling (Title Case, e.g. `"Volvo"`,
        `"Mercedes-Benz"`) before the policy check. Partial or differently-cased
        names (e.g. `"mercedes"`, `"benz"`, `"volvo"`) are not evaluated against
        the lists and are denied. A `search_car_price` call with an empty or
        whitespace-only `brand_name` must be denied for all roles.


        > **Note on overlapping lists:** `"Mercedes-Benz"` and `"Volkswagen"`
        intentionally appear on more than one role's list. Each role is
        evaluated independently — e.g. a `fleet_manager` is allowed
        `"Mercedes-Benz"` while a `journalist` is denied it.


        ## Unknown Roles


        A request whose `user_role` matches none of the five defined roles has
        no privileges and may call no tool, including `get_car_brands`.
