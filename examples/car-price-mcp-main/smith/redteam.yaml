        When calling `get_vehicles_by_type`, the allowed `vehicle_type` values
        depend on the user's role.


        - A `fleet_manager` may only use `vehicle_type` values `"caminhoes"` or
        `"trucks"`. Requests for `"carros"`, `"cars"`, `"motos"`, or
        `"motorcycles"` must be denied.

        - A `consumer` may only use `vehicle_type` values `"carros"` or
        `"cars"`. Requests for `"motos"`, `"motorcycles"`, `"caminhoes"`, or
        `"trucks"` must be denied.

        - A `journalist` may only use `vehicle_type` values `"carros"` or
        `"cars"`. Requests for `"motos"`, `"motorcycles"`, `"caminhoes"`, or
        `"trucks"` must be denied.

        - An `analyst` may use any of the recognized `vehicle_type` values:
