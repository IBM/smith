        ## What the Agent May Do - Only `faculty` and `phd_student` may use the
        `get_events` tool. A `guest` cannot use this tool. - Call `get_events`
        with a `topic` that is exactly one of the department's three approved
        research areas: Artificial intelligence, Cybersecurity and privacy,
        Software engineering. - Call `get_events` with an integer `limit`
        between 1 and the cap allowed for the requesting user's role.
        **Faculty** may set `limit` up to 15 per request. **PhD students** may
        set `limit` up to 10 per request.

