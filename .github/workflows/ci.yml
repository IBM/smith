# ===============================================================
# CI — lint, license headers, policy lint, build smoke, and audit.
# Targets mirror the Makefile so a green `make ci` locally means a
# green pipeline.
# ===============================================================

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      # `make lint` runs ruff/black via `uvx` with versions pinned in the
      # Makefile (ruff 0.15.20 / black 26.5.1); bump those alongside a reformat.
      - name: make lint
        run: make lint

  license:
    name: License headers
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: make license-check
        run: make license-check

  unit:
    name: Unit tests (pytest)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Smith with dev extras
        run: make install
      - name: make unit
        run: make unit

  build:
    name: Build + CLI smoke
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Smith (uv) and smoke-test the CLI
        run: make build

  audit:
    name: Dependency audit (advisory)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: surfaces known CVEs in dependencies without blocking the
    # pipeline. Triage findings in a follow-up.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: pip-audit
        run: make audit
